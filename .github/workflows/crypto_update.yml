name: Weekly Crypto Shariah Screener

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:
  update-crypto:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install requests
    
    - name: Run Global Crypto Screener
      env:
        # Fetching the API Key from GitHub Secrets Vault securely
        CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      run: python crypto_updater.py
      
    - name: Commit and Push Final Data
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add crypto_data.json
        git commit -m "Auto-update Global Crypto Shariah Data from CoinMarketCap" || echo "No changes to commit"
        git push
